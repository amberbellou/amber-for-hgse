<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Responses · Amber for HGSE</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .dash { padding: 32px clamp(16px, 4vw, 40px) 60px; max-width: 1100px; margin: 0 auto; position: relative; z-index: 2; }
    .login { max-width: 460px; margin: 10vh auto 0; text-align: center; }
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin: 18px 0 22px; }
    .stat { background: #fff; border-radius: 16px; padding: 14px 16px; border: 1px solid rgba(31,42,68,0.06); }
    .stat b { display: block; font-size: 1.8rem; font-family: var(--font-head); line-height: 1.1; }
    .stat span { color: var(--ink-soft); font-size: 0.85rem; font-weight: 700; }
    .bars { display: grid; gap: 8px; margin-bottom: 22px; }
    .bar { display: grid; grid-template-columns: 240px 1fr 40px; align-items: center; gap: 10px; font-size: 0.92rem; font-weight: 700; }
    .bar i { display: block; height: 12px; border-radius: 999px; background: linear-gradient(90deg, var(--coral), var(--gold)); min-width: 4px; }
    .toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 14px; }
    .toolbar input, .toolbar select { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1.5px solid rgba(31,42,68,0.14); background: #fff; }
    .toolbar input { flex: 1; min-width: 200px; }
    .resp { background: #fff; border-radius: 18px; padding: 16px 18px; border: 1px solid rgba(31,42,68,0.06); margin-bottom: 12px; }
    .resp .meta { display: flex; gap: 8px; flex-wrap: wrap; font-size: 0.82rem; color: var(--ink-soft); font-weight: 700; margin-bottom: 8px; }
    .resp .meta .cat { color: var(--coral-deep); }
    .resp p { margin: 0; white-space: pre-wrap; }
    .resp .who { margin-top: 8px; font-size: 0.88rem; color: var(--ink-soft); }
    .btn.small { padding: 10px 16px; font-size: 0.9rem; }
    .empty { text-align: center; color: var(--ink-soft); padding: 30px; }
    .orbit { opacity: 0.35; }
  </style>
</head>
<body>
  <div class="sky" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>
  <div class="orbit" id="orbit" aria-hidden="true"></div>
  <header class="top">
    <a class="brand" href="index.html">Amber Bellou</a>
    <nav class="nav"><a href="index.html">← Back to site</a></nav>
  </header>

  <main class="dash">
    <section class="glass login" id="login">
      <p class="eyebrow">Private</p>
      <h2>Responses dashboard</h2>
      <p class="small">Enter your passcode to load what students have shared.</p>
      <form id="login-form">
        <label class="field"><span>Passcode</span><input type="password" name="key" autocomplete="current-password" required></label>
        <button class="btn primary" type="submit" id="login-btn">Load responses</button>
        <p class="status" id="login-status"></p>
      </form>
    </section>

    <section class="glass" id="panel" hidden style="max-width: 1100px;">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <div><p class="eyebrow" style="margin:0">Responses</p><h2 style="margin:4px 0 0">What students are telling you</h2></div>
        <div style="display:flex; gap:8px;">
          <button class="btn ghost small" id="refresh-btn" type="button">Refresh</button>
          <button class="btn primary small" id="csv-btn" type="button">Download CSV</button>
        </div>
      </div>
      <p class="tiny" id="mode-note"></p>
      <div class="stats" id="stats"></div>
      <div class="bars" id="bars"></div>
      <div class="toolbar">
        <input type="search" id="q" placeholder="Search responses…">
        <select id="cat-filter"><option value="">All topics</option></select>
      </div>
      <div id="list"></div>
    </section>
  </main>

  <script src="config.js"></script>
  <script>
  (function () {
    var cfg = window.SITE_CONFIG || {};
    var DEMO_KEY = "amber-hgse-demo-responses";
    var rows = [], key = "";

    var $ = function (id) { return document.getElementById(id); };
    function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]; }); }

    function load(k) {
      if (!cfg.endpoint) {
        var demo = [];
        try { demo = JSON.parse(localStorage.getItem(DEMO_KEY) || "[]"); } catch (e) {}
        return Promise.resolve({ ok: true, demo: true, rows: demo });
      }
      return fetch(cfg.endpoint, {
        method: "POST",
        headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "list", key: k })
      }).then(function (r) { return r.json(); });
    }

    function render() {
      var q = $("q").value.trim().toLowerCase();
      var cat = $("cat-filter").value;
      var counts = {}, programs = {}, withEmail = 0;
      rows.forEach(function (r) {
        counts[r.category || "Uncategorized"] = (counts[r.category || "Uncategorized"] || 0) + 1;
        if (r.program) programs[r.program] = (programs[r.program] || 0) + 1;
        if (r.email) withEmail++;
      });
      var cats = Object.keys(counts).sort(function (a, b) { return counts[b] - counts[a]; });
      var last = rows.length ? new Date(rows[rows.length - 1].timestamp) : null;
      var week = rows.filter(function (r) { return Date.now() - new Date(r.timestamp).getTime() < 7 * 864e5; }).length;

      $("stats").innerHTML =
        '<div class="stat"><b>' + rows.length + '</b><span>Total responses</span></div>' +
        '<div class="stat"><b>' + week + '</b><span>In the last 7 days</span></div>' +
        '<div class="stat"><b>' + cats.length + '</b><span>Topics raised</span></div>' +
        '<div class="stat"><b>' + withEmail + '</b><span>Want a follow-up</span></div>' +
        '<div class="stat"><b style="font-size:1.05rem;padding-top:8px">' + (last ? last.toLocaleDateString() : "—") + '</b><span>Most recent</span></div>';

      var max = cats.length ? counts[cats[0]] : 1;
      $("bars").innerHTML = cats.map(function (c) {
        return '<div class="bar"><span>' + esc(c) + '</span><i style="width:' + (100 * counts[c] / max) + '%"></i><span>' + counts[c] + '</span></div>';
      }).join("");

      var sel = $("cat-filter"), current = sel.value;
      sel.innerHTML = '<option value="">All topics</option>' + cats.map(function (c) { return '<option' + (c === current ? " selected" : "") + '>' + esc(c) + '</option>'; }).join("");

      var shown = rows.slice().reverse().filter(function (r) {
        if (cat && r.category !== cat) return false;
        if (q && (r.message + " " + r.name + " " + r.program + " " + r.category).toLowerCase().indexOf(q) < 0) return false;
        return true;
      });
      $("list").innerHTML = shown.length ? shown.map(function (r) {
        var d = new Date(r.timestamp);
        return '<article class="resp"><div class="meta"><span class="cat">' + esc(r.category || "Uncategorized") + '</span>' +
          '<span>· ' + (isNaN(d) ? esc(r.timestamp) : d.toLocaleString()) + '</span>' +
          (r.program ? '<span>· ' + esc(r.program) + '</span>' : "") + '</div>' +
          '<p>' + esc(r.message) + '</p>' +
          ((r.name || r.email) ? '<div class="who">' + esc(r.name || "Anonymous") + (r.email ? ' · <a href="mailto:' + esc(r.email) + '">' + esc(r.email) + '</a>' : "") + '</div>' : '<div class="who">Anonymous</div>') +
          '</article>';
      }).join("") : '<p class="empty">No responses match yet.</p>';
    }

    function csv() {
      var head = ["timestamp", "category", "message", "program", "name", "email"];
      var lines = [head.join(",")].concat(rows.map(function (r) {
        return head.map(function (h) { return '"' + String(r[h] == null ? "" : r[h]).replace(/"/g, '""') + '"'; }).join(",");
      }));
      var blob = new Blob(["﻿" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "hgse-responses-" + new Date().toISOString().slice(0, 10) + ".csv";
      document.body.appendChild(a); a.click(); a.remove();
    }

    function doLoad(k, btn, statusEl) {
      if (btn) btn.disabled = true;
      if (statusEl) { statusEl.textContent = "Loading…"; statusEl.className = "status info"; }
      return load(k).then(function (res) {
        if (!res || !res.ok) throw new Error((res && res.error) || "Could not load");
        rows = res.rows || [];
        key = k;
        $("mode-note").textContent = res.demo
          ? "Demo mode: showing responses saved in this browser only. Connect the backend (see README) to see real submissions."
          : "Live: " + rows.length + " responses loaded from your Google Sheet.";
        $("login").hidden = true;
        $("panel").hidden = false;
        render();
      }).catch(function (e) {
        if (statusEl) { statusEl.textContent = e.message || "Could not load responses."; statusEl.className = "status error"; }
      }).finally(function () { if (btn) btn.disabled = false; });
    }

    $("login-form").addEventListener("submit", function (ev) {
      ev.preventDefault();
      doLoad(ev.target.key.value, $("login-btn"), $("login-status"));
    });
    $("refresh-btn").addEventListener("click", function () { doLoad(key, $("refresh-btn")); });
    $("csv-btn").addEventListener("click", csv);
    $("q").addEventListener("input", render);
    $("cat-filter").addEventListener("change", render);
  })();
  </script>
  <script src="app.js"></script>
</body>
</html>
